name: Actualizar radar y mandar alertas

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Traer fechas nuevas
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: python updater/update_events.py
      - name: Releases and official videos (iTunes + YouTube RSS, no keys)
        run: python updater/media.py
      - name: Números de cada grupo (Apple Music sin clave; YouTube con YT_API_KEY opcional)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python updater/stats.py || echo "stats falló, se conservan los anteriores"
      - name: Avistamientos en X (sin token deja datos de ejemplo)
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python sightings/fetch_x.py
      - name: Librería para notificaciones push
        run: pip install --quiet pywebpush || echo "sin pywebpush, las notificaciones push se saltan"
      - name: Detectar cambios y mandar alertas
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          SUBSCRIBERS_URL: ${{ secrets.SUBSCRIBERS_URL }}
          SUBSCRIBERS_TOKEN: ${{ secrets.SUBSCRIBERS_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python alerts/engine.py
      - name: Reconstruir index.html
        run: python build.py
      - name: Commit si hubo cambios
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add events.json alerts.json sightings.json media.json stats.json index.html sw.js state/ CHANGELOG.md
          if [ -f sightings/user_ids.json ]; then git add sightings/user_ids.json; fi
          git diff --cached --quiet || (git commit -m "Actualiza radar y alertas" && git push)
