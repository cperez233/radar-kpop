name: Actualizar radar y mandar alertas

# Corre solo cada 15 minutos (GitHub puede retrasarlo) y también a mano desde Actions > Run workflow.
# Cada paso de datos falla suave (continue-on-error): si un servicio se cae, los demás siguen, los datos se
# guardan igual en la rama data y el resumen del run dice qué funcionó. Las claves están en Settings > Secrets (ver CLAVES.md).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Mandar una alerta de prueba a Discord, ntfy y cada publicación del foro (y nada más)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # solo para el keepalive de abajo

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Los datos y el estado del robot viven en la rama "data", no en main: cada push a main crea un deploy en Vercel (aunque
      # vercel-ignore.js lo cancele, cuenta para el límite de 100 al día de la cuenta). GitHub Pages sirve la rama data y la
      # página la lee en vivo (config.js > dataUrl). Si la rama todavía no existe, se parte de los datos que hay en main.
      - name: Traer datos y estado de la rama data
        run: |
          if git fetch --depth=1 origin data; then
            git checkout FETCH_HEAD -- $(git ls-tree -r --name-only FETCH_HEAD | grep -Ev '^(vercel\.json|\.nojekyll|\.gitignore)$')
          else
            echo "La rama data todavía no existe: se parte de los datos de main"
          fi

      - name: Alerta de prueba
        if: ${{ inputs.prueba }}
        env:
          TEST_ALERT: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python alerts/engine.py

      - name: Fechas de gira (Ticketmaster + overrides, poda de fechas viejas)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: python updater/update_events.py

      - name: Estrenos y videos (Apple Music + YouTube)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python updater/media.py

      - name: Números de cada grupo (Spotify vía kworb, YouTube)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python updater/stats.py

      - name: Avistamientos (cuentas oficiales vía RSSHub; X de respaldo)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        env:
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python sightings/fetch_x.py

      - name: Fechas de Asia y otras desde anuncios oficiales y prensa (por confirmar)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        run: python updater/auto_dates.py

      - name: Redes de grupos y miembros (TikTok vía RSSHub, posts de X)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        env:
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
        run: python updater/social_feeds.py

      - name: Próximos estrenos anunciados en posts oficiales
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        run: python updater/releases.py

      - name: Integrantes (servicio militar, regresos y salidas desde avisos oficiales y prensa)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        timeout-minutes: 5
        run: python updater/roster_watch.py

      - name: Lightstick oficial de los grupos que aún no tienen (avisos oficiales y prensa)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        timeout-minutes: 3
        run: python updater/lightstick_watch.py

      - name: Librería para notificaciones push del navegador
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        run: pip install --quiet pywebpush

      - name: Detectar cambios y mandar alertas
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          SUBSCRIBERS_URL: ${{ secrets.SUBSCRIBERS_URL }}
          SUBSCRIBERS_TOKEN: ${{ secrets.SUBSCRIBERS_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python alerts/engine.py

      - name: Resumen del run y vigilante (avisa si una fuente empieza a fallar)
        if: ${{ always() && !inputs.prueba }}
        env:
          HAS_TM_API_KEY: ${{ secrets.TM_API_KEY != '' }}
          HAS_YT_API_KEY: ${{ secrets.YT_API_KEY != '' }}
          HAS_RSSHUB_URL: ${{ secrets.RSSHUB_URL != '' }}
          HAS_X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN != '' }}
          HAS_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
          HAS_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC != '' }}
          HAS_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY != '' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tools/health.py --notify

      # GitHub apaga las tareas programadas de un repo público tras 60 días sin actividad. Los commits del robot ya cuentan,
      # pero por si un mes no hubiera cambios: una vez al día (la primera corrida después de las 00:00 UTC) se vuelve a habilitar.
      - name: Mantener vivo el robot
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H%M)" -lt 0015 ]; then gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-radar.yml/enable" && echo "keepalive ok"; fi

      # Solo a la rama data: main (y por tanto Vercel) no se toca. index.html ya no se reconstruye aquí; la copia de datos que
      # trae el sitio se refresca cuando se sube código (ver README.es.md, "Datos en vivo").
      - name: Guardar datos en la rama data
        if: ${{ !inputs.prueba }}
        run: |
          git config --global user.name "radar-bot"
          git config --global user.email "radar-bot@users.noreply.github.com"
          DATOS="events.json alerts.json sightings.json media.json stats.json notices.json socialfeed.json rosterwatch.json lightsticks.json releases.json state"
          if [ -f sightings/user_ids.json ]; then DATOS="$DATOS sightings/user_ids.json"; fi
          DIR="$RUNNER_TEMP/data"
          if git fetch --depth=1 origin data; then git worktree add -q "$DIR" FETCH_HEAD; else git worktree add -q --orphan -b data "$DIR"; fi
          cp -r --parents $DATOS "$DIR/"
          cp .gitignore "$DIR/.gitignore"  # mismas exclusiones que main (state/social.json no se publica)
          touch "$DIR/.nojekyll"           # GitHub Pages sirve los archivos tal cual
          echo '{"git":{"deploymentEnabled":false}}' > "$DIR/vercel.json"  # y Vercel no despliega esta rama
          cd "$DIR"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Actualiza datos del radar"
          git push origin HEAD:data || { sleep 5; git push origin HEAD:data; }
