name: Actualizar radar y mandar alertas

# Corre solo cada 15 minutos (GitHub puede retrasarlo) y también a mano desde Actions > Run workflow.
# Cada paso de datos falla suave (continue-on-error): si un servicio se cae, los demás siguen, la página se
# reconstruye igual y el resumen del run dice qué funcionó. Las claves están en Settings > Secrets (ver CLAVES.md).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Mandar una alerta de prueba a Discord, ntfy y cada publicación del foro (y nada más)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Alerta de prueba
        if: ${{ inputs.prueba }}
        env:
          TEST_ALERT: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python alerts/engine.py

      - name: Fechas de gira (Ticketmaster + overrides, poda de fechas viejas)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: python updater/update_events.py

      - name: Estrenos y videos (Apple Music + YouTube)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python updater/media.py

      - name: Números de cada grupo (Spotify vía kworb, YouTube)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python updater/stats.py

      - name: Avistamientos (cuentas oficiales vía RSSHub; X de respaldo)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        env:
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python sightings/fetch_x.py

      - name: Fechas de Asia y otras desde anuncios oficiales y prensa (por confirmar)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        run: python updater/auto_dates.py

      - name: Redes de grupos y miembros (TikTok vía RSSHub, posts de X)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        env:
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
        run: python updater/social_feeds.py

      - name: Próximos estrenos anunciados en posts oficiales
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        run: python updater/releases.py

      - name: Integrantes (servicio militar, regresos y salidas desde avisos oficiales y prensa)
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        timeout-minutes: 5
        run: python updater/roster_watch.py

      - name: Librería para notificaciones push del navegador
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        run: pip install --quiet pywebpush

      - name: Detectar cambios y mandar alertas
        if: ${{ !inputs.prueba }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          SUBSCRIBERS_URL: ${{ secrets.SUBSCRIBERS_URL }}
          SUBSCRIBERS_TOKEN: ${{ secrets.SUBSCRIBERS_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python alerts/engine.py

      - name: Reconstruir index.html
        if: ${{ !inputs.prueba }}
        run: python build.py

      - name: Resumen del run y vigilante (avisa si una fuente empieza a fallar)
        if: ${{ always() && !inputs.prueba }}
        env:
          HAS_TM_API_KEY: ${{ secrets.TM_API_KEY != '' }}
          HAS_YT_API_KEY: ${{ secrets.YT_API_KEY != '' }}
          HAS_RSSHUB_URL: ${{ secrets.RSSHUB_URL != '' }}
          HAS_X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN != '' }}
          HAS_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
          HAS_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC != '' }}
          HAS_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY != '' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tools/health.py --notify

      - name: Commit si hubo cambios
        if: ${{ !inputs.prueba }}
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add events.json alerts.json sightings.json media.json stats.json notices.json socialfeed.json rosterwatch.json releases.json index.html sw.js state/ CHANGELOG.md
          if [ -f sightings/user_ids.json ]; then git add sightings/user_ids.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Actualiza radar y alertas"
          # si alguien subió cambios mientras corría: se trae main (gana el dato nuevo del robot), se reconstruye y se reintenta
          git push || { git pull --rebase -X theirs origin main && python build.py && git add index.html sw.js && git commit --amend --no-edit && git push; }
