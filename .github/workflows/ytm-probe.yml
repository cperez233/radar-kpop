name: ytm probe (temporal)
on:
  push:
    branches: [claude/sweet-allen-ogul4r]
    paths: [tools/ytm_probe.py, .github/workflows/ytm-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/checkout@v5
        with: { path: probe }
      - run: python probe/tools/ytm_probe.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
